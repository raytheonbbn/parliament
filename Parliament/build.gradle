// caller
def linuxFixups = """\
	ParliamentAdmin
	libParliament
	libboost_log_setup-
	libboost_log-
	librocksdb
	liblz4""".stripIndent()

dependencies {
	api libs.jenaArq
	implementation libs.slf4jApi
	testImplementation libs.logback
}

configurations.all {
	exclude group: 'xml-apis'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

compileJava {
	options.headerOutputDirectory = jniHeaderGenDir
}

task sourcesJar(type: Jar) {
	archiveClassifier = 'sources'
	from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
	archiveClassifier = 'javadoc'
	from javadoc.destinationDir
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options
	{
		//setMemberLevel JavadocMemberLevel.PUBLIC
		//setAuthor true
		addStringOption('Xdoclint:-missing', '-quiet')
	}
}

classes {
	dependsOn 'fixupSharedLibs', 'copyNativeConfig'
}

assemble {
	dependsOn 'sourcesJar', 'javadocJar'
}

testing {
	suites {
		test {
			useJUnitJupiter(libs.versions.jupiterVer)
		}
	}
}

test {
	dependsOn 'buildTest', 'fixupSharedLibs', 'copyNativeConfig'
	systemProperty 'java.library.path', "${deployableDir}/bin"
}

String getToolSet() {
	def os = System.getProperty('os.name').toLowerCase()
	if (os.contains('windows')) {
		return 'msvc'
	} else if (os.contains('mac')) {
		return 'clang'
	} else {
		return 'gcc'
	}
}

String[] getB2CommandLine() {
	def p = ~'^nativeBuildParams[ \t]*=(.*)$'
	def toolSet = getToolSet()
	def propsFile = buildProps.exists() ? buildProps : defaultBuildProps
	List<String[]> paramsList = Files.lines(propsFile.toPath(), StandardCharsets.UTF_8)
		.map(String::strip)
		.map(p::matcher)
		.filter(Matcher::matches)
		.map(m -> m.group(1))
		.map(String::strip)
		.filter(str -> str.contains(toolSet))
		.map(str -> str.split(" +"))
		.toList();
	if (paramsList.size() < 1) {
		throw new GradleException("Unable to find a build parameter set in $propsFile")
	} else if (paramsList.size() > 1) {
		println("Warning: Multiple build parameter sets are active in $propsFile")
	}
	def params = new ArrayList<String>();
	params.add('b2');
	params.add('-q');
	params.addAll(List.of(paramsList.getFirst()))
	return params.toArray(new String[0])
}

task buildTest(type:Exec) {
	commandLine getB2CommandLine()
	workingDir "$projectDir/Test"
}

task buildKbCore(type:Exec, dependsOn: 'compileJava') {
	commandLine getB2CommandLine()
	workingDir "$projectDir/KbCore"
	environment 'GENERATED_JNI_HEADER_DIR', "$jniHeaderIncludeDir"
	environment 'NATIVE_CODE_INSTALL_DIR', "${deployableDir}/bin"
}

task buildAdminClient(type:Exec, dependsOn: 'buildKbCore') {
	commandLine getB2CommandLine()
	workingDir "$projectDir/AdminClient"
	environment 'NATIVE_CODE_INSTALL_DIR', "${deployableDir}/bin"
}

task fixupSharedLibs(dependsOn: 'createFixupSharedLibsScript', type: Exec) {
	onlyIf("Running on Mac OS or Linux") {
		def os = System.getProperty('os.name').toLowerCase()
		os.contains('mac') || os.contains('linux')
	}
	executable = 'bash'
	args = ['-c', ". $fixupScript"]
	workingDir "${deployableDir}/bin"
	//standardOutput = System.out
	//errorOutput = System.err
	//ignoreExitValue = false
}

task createFixupSharedLibsScript(dependsOn: 'buildAdminClient') {
	doLast {
		def pattern = ~/.*/
		def replacement = ''
		def matcher = ''
		def os = System.getProperty('os.name').toLowerCase()
		if (os.contains('mac')) {
			pattern = ~/(?m)^([^,]*),([^,]*),([^,]*)$/
			// The parenthesis around the callee value cause the evaluation of the
			// glob to an array, and subsequent expansion of callee gets the first
			// (and hopefully only) element in the array:
			replacement = 'callee=($2*) ; install_name_tool -change $3\\$callee @loader_path/\\$callee $1*'
			matcher = macOsFixups =~ pattern
		} else if (os.contains('linux')) {
			pattern = ~/(?m)^([^\n]*)$/
			replacement = 'patchelf --set-rpath \'\\$ORIGIN\' $1*'
			matcher = linuxFixups =~ pattern
		}

		if (!replacement.isEmpty()) {
			def commands = matcher.replaceAll(replacement)
			fixupScript.withWriter { writer ->
				writer.writeLine '#!/bin/bash'
				writer.writeLine ''
				writer.writeLine commands
			}
		}
	}
}

task copyNativeConfig(type: Copy) {
	from("$projectDir/KbCore") {
		include '**/Parliament*Config.txt'
	}
	into "${deployableDir}"
	includeEmptyDirs = false
}

clean {
	delete "${targetDir}"
	delete "${projectDir}/kb-data"
	delete "${projectDir}/Test/kb-data"
}

publishing {
	publications {
		Parliament(MavenPublication) {
			from components.java

			artifact sourcesJar {
				archiveClassifier = 'sources'
			}
			artifact javadocJar {
				archiveClassifier = 'javadoc'
			}

			pom {
				name = 'Parliament Client Library'
				description = "A Java library for accessing Parliament's native code.${System.lineSeparator}Copyright © 2023 RTX BBN Technologies Corp."
				url = "https://github.com/${githubOrg}/parliament/tree/main/jena/Parliament"
				organization {
					name = 'RTX BBN Technologies'
					url = 'https://bbn.com/'
				}
				developers {
					developer {
						id = 'iemmons'
						name = 'Ian Emmons'
						email = 'iemmons@rtx.com'
					}
				}
			}
		}
	}

	repositories {
		maven {
			url = "${artifactory_contextUrl}/bbn-maven-us-only"
			credentials {
				username = "${artifactory_user}"
				password = "${artifactory_password}"
			}
		}
	}
}
