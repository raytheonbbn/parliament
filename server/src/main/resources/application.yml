# https://docs.spring.io/spring-boot/appendix/application-properties/index.html

spring:
   application:
      name: Parliament
   jackson:
      serialization:
         indent_output: false
   servlet:
      multipart:
         enabled: true
         max-file-size: -1
         max-request-size: -1
         # location: ''
         file-size-threshold: 64KB
         resolve-lazily: true
      web:
         error:
            include-binding-errors: always
            include-exception: false
            include-message: always
            include-path: always
            include-stacktrace: never
            whitelabel:
               enabled: true

server:
   port: 8089
   address: 127.0.0.1
   http2:
      enabled: false
   compression:
      additional-mime-types:           # additional MIME types to be compressed
         - application/ld+json
         - application/n-quads
         - application/n-triples
         - application/rdf+json
         - application/rdf+xml
         - application/sparql-results+json
         - application/sparql-results+xml
         - application/trig
         - text/csv                    # for sparql results
         - text/tab-separated-values   # for sparql results
         - text/turtle
         - text/xml                    # for trix
      enabled: true
   # ssl:
   #   To configure SSL, append this fragment to the URL at the top of the file:
   #   #application-properties.server.server.ssl.bundle

parliament:
   config-file: parliament-config.ttl
