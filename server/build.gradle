import com.bbn.parliament.build_logic.UncPathMapper;

plugins {
	id 'java-library'
	alias(libs.plugins.springBoot)
	alias(libs.plugins.springDepMgmt)
}

ext {
	genJavaDir = file("$buildDir/generated/sources/java")
	//genJavaDir = layout.buildDirectory.dir('generated/sources/java')
	configVocabFile = layout.projectDirectory.file('src/main/resources/config-ont.ttl')
	configVocabPackage = 'com.bbn.parliament.server.configuration.vocab'
	configVocabDir = configVocabPackage.replaceAll(/\./, '/')
	configVocabClassNm = 'ConfigOnt'
	configVocabSource = "${genJavaDir}/${configVocabDir}/${configVocabClassNm}.java"
}

configurations {
	schemagen
}

dependencies {
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	schemagen libs.jenaCmds
	schemagen libs.logback
	schemagen libs.jclOverSlf4j
	schemagen libs.slf4jApi

	implementation project(':Parliament')
	implementation project(':jena:ParliamentClient')
	implementation project(':jena:KbGraph')
	implementation project(':jena:NumericIndex')
	implementation project(':jena:SparqlQueryBuilder')
	implementation project(':jena:SpatialIndex')
	implementation project(':jena:TemporalIndex')

	implementation libs.commonsCsv
	implementation libs.commonsIo
	implementation libs.commonsLang
	implementation libs.jenaArq
	implementation libs.slf4jApi
	implementation 'org.springframework.boot:spring-boot-starter-web'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
}

java {
	sourceSets {
		main {
			java { srcDir genJavaDir }
		}
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	withJavadocJar()
}

// See https://jena.apache.org/documentation/tools/schemagen.html
task runSchemagen(type: JavaExec) {
	inputs.file(configVocabFile)
	outputs.file(configVocabSource)

	classpath = layout.files(
		configurations.schemagen,
		layout.projectDirectory.dir('schemagen-classpath'))
	mainClass = 'jena.schemagen'
	args = [
		'-i', UncPathMapper.mapUncPath(configVocabFile.toString()),
		'-e', 'TURTLE',
		'-o', "${genJavaDir}",
		'--owl',
		'-n', configVocabClassNm,
		'--package', configVocabPackage
	]
}

compileJava.dependsOn runSchemagen

javadoc {
	source = java.sourceSets.main.allJava
	classpath = configurations.compileClasspath
	dependsOn runSchemagen
	options
	{
		//setMemberLevel JavadocMemberLevel.PUBLIC
		//setAuthor true
		addStringOption('Xdoclint:-missing', '-quiet')
	}
}

tasks.getByName('sourcesJar') {
	from java.sourceSets.main.allSource
	dependsOn runSchemagen
}

clean {
	delete layout.projectDirectory.dir('kb-data')
	delete layout.projectDirectory.dir('log')
}

testing {
	suites {
		test {
			useJUnitJupiter(libs.versions.jupiterVer)
		}
	}
}

test {
	systemProperty 'java.library.path', rootProject.ext.distDirBin
	systemProperty 'test.data.path', rootProject.ext.depDataDir

	workingDir = layout.buildDirectory
}

bootRun {
	//def distroDir = rootProject.ext.targetDir.listFiles().find { it.name =~ /^parliament-[.0-9]+-.*$/ }

	systemProperty 'java.library.path', rootProject.ext.distDirBin
}

task distArchive(type:Zip) {
	archiveFileName = "${rootProject.ext.distName}.zip"
	destinationDirectory = rootProject.ext.targetDir
	from(rootProject.ext.distDir) {
		include "**/*"
		into rootProject.ext.distName
	}

	dependsOn 'assemble',
		'copyDocs',
		(System.getProperty('os.name').toLowerCase().contains('win')
			? 'copyStartScriptsWindows'
			: 'copyStartScriptsPosix'),
		'copyLicenses',
		'copyConfigs',
		'copyJars'
}

task copyDocs(type:Copy) {
	into rootProject.ext.distDir
	with copySpec {
		from layout.settingsDirectory.dir('doc/UserGuide')
		include 'ParliamentUserGuide.pdf'
	}
}

task copyStartScriptsPosix(type:Copy) {
	into rootProject.ext.distDir
	with copySpec {
		from layout.projectDirectory.dir('config')
		include 'parliament', '*.sh'
	}
	filePermissions {
		user.execute = true
		group.execute = true
		other.execute = true
	}
}

task copyStartScriptsWindows(type:Copy) {
	into rootProject.ext.distDir
	with copySpec {
		from layout.projectDirectory.dir('config')
		include '*.ps1', '*.bat'
	}
}

task copyLicenses(type:Copy) {
	into "${rootProject.ext.distDir}/license"
	with copySpec {
		from layout.settingsDirectory
		include 'LICENSE.md'
		rename 'LICENSE.md', 'parliament-license.md'
	}
	with copySpec {
		from layout.settingsDirectory.dir('license')
		include '*.html', '*.md', '*.txt'
	}
}

task copyConfigs(type:Copy) {
	into "${rootProject.ext.distDir}/config"
	with copySpec {
		from layout.projectDirectory.dir('config')
		include 'log4j.*.properties', 'parliament-redirect-*.conf'
	}
}

task copyJars(type:Copy) {
	into "${rootProject.ext.distDir}/lib"
	with copySpec {
		from layout.buildDirectory.dir('libs')
		include 'server-*.jar'
		exclude '*-javadoc.jar', '*-plain.jar', '*-sources.jar'
	}
	dependsOn 'assemble'
}

tasks.named('build') {
	dependsOn(distArchive)
}
