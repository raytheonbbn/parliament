ext {
	parliamentVersion = '3.0.0'
	githubOrg = 'raytheonbbn'

	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		parliamentPlatform = 'mac'
		parliamentArch = System.getenv().getOrDefault('BOOST_ARCHITECTURE', "unknown")
		distName = "parliament-${parliamentVersion}-${parliamentPlatform}"
		imageName = "parliament-${parliamentVersion}-${parliamentArch}"
	} else if (System.getProperty('os.name').toLowerCase().contains('win')) {
		parliamentPlatform = 'win'
		vsTgtArch = System.getenv().getOrDefault('VSCMD_ARG_TGT_ARCH', "unknown")
		if (vsTgtArch.equalsIgnoreCase("x64")) {
			parliamentArch = 'x64'
		} else if (vsTgtArch.equalsIgnoreCase("x32")) {
			parliamentArch = 'x32'
		} else if (vsTgtArch.equalsIgnoreCase("arm64")) {
			parliamentArch = 'a64'
		} else {
			parliamentArch = 'unknown'
		}
		distName = "parliament-${parliamentVersion}-${parliamentPlatform}-${parliamentArch}"
		imageName = "parliament-${parliamentVersion}-${parliamentArch}"
	} else {
		parliamentPlatform = System.getenv().getOrDefault('LINUX_DISTRO', "unknown")
		parliamentArch = System.getenv().getOrDefault('BOOST_ARCHITECTURE', "unknown")
		distName = "parliament-${parliamentVersion}-${parliamentPlatform}-${parliamentArch}"
		imageName = "parliament-${parliamentVersion}-${parliamentArch}"
	}

	settingsDir = layout.settingsDirectory
	targetDir = settingsDir.dir('target')
	distDir = targetDir.dir(distName)
	distDirBin = file(distDir.dir('bin'))
	rootProject.ext.debugLogbackConfig = file(settingsDir.file('logback.debug.xml'))
	depDir = file(System.getenv().getOrDefault('PARLIAMENT_DEPENDENCIES', "${settingsDir}/dependencies"))
	depDataDir = file("${depDir}/data")
}

allprojects {
	group = 'com.bbn.parliament'
	version = rootProject.ext.parliamentVersion

	tasks.withType(JavaCompile).all {
		options.compilerArgs.add('-Xlint:all')
		options.encoding = 'UTF-8'
	}
}

subprojects {
	repositories {
		maven {
			url = uri('https://repo.osgeo.org/repository/release/')
		}
		mavenCentral()
	}
}
